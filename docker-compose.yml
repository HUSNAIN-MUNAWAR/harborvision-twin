services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-harborvision}
      POSTGRES_USER: ${POSTGRES_USER:-harborvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harborvision-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harborvision} -d ${POSTGRES_DB:-harborvision}"]
      interval: 5s
      timeout: 4s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [redis-data:/data]
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-harborvision}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-harborvision-local-only}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes: [minio-data:/data]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-harborvision}:${POSTGRES_PASSWORD:-harborvision-local-only}@postgres:5432/${POSTGRES_DB:-harborvision}
      JWT_SECRET: ${JWT_SECRET:-replace-this-local-secret-change-me-32-bytes}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      STORAGE_DIR: /app/data/generated
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: [generated-data:/app/data/generated]
    ports: ["8000:8000"]
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-harborvision}:${POSTGRES_PASSWORD:-harborvision-local-only}@postgres:5432/${POSTGRES_DB:-harborvision}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      STORAGE_DIR: /app/data/generated
    depends_on:
      postgres: {condition: service_healthy}
    volumes: [generated-data:/app/data/generated]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on: [api]
    ports: ["3000:80"]
volumes:
  postgres-data:
  redis-data:
  minio-data:
  generated-data:
