server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /healthz { add_header Content-Type text/plain; return 200 'ok'; }
  location /assets/ { alias /usr/share/nginx/html/; }
  location /api/ { proxy_pass http://api:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_buffering off; }
  location /artifacts/ { proxy_pass http://api:8000; }
  location / { try_files $uri /index.html; }
}
