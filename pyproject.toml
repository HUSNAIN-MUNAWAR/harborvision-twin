[project]
name = "harborvision-twin"
version = "2.0.0"
description = "CPU-first smart port digital twin and terminal intelligence platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
exclude = ["infrastructure/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
