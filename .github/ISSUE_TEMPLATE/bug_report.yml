name: Bug report
description: Report a reproducible defect in HarborVision Twin
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, real port data, or private camera media.
  - type: input
    id: version
    attributes: {label: Version or commit, placeholder: "v2.0.0 or commit SHA"}
    validations: {required: true}
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [API, Web console, Database migration, Simulation, OCR, Video analytics, Docker, Documentation]
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior and safe logs}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: Environment, description: OS, Python, database adapter, and relevant command}
    validations: {required: true}
